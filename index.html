<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SecondParts | Piese auto noi, second hand și dezmembrări</title>
<meta name="description" content="Piese auto noi și second hand, direct de la dezmembrări. Caută după cod OEM, marcă și model.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="w">
  <div class="logo">Second<b>Parts</b></div>
  <nav><button id="t1" class="on" onclick="show('list')">Piese</button><button id="t2" class="cta" onclick="show('add')" hidden>Publică piesă</button><button id="t3" onclick="show('login')">Admin</button><button id="t4" onclick="logout()" hidden>Ieșire</button></nav>
</div></header>

<div id="home">
<div class="hero"><div class="w">
  <h1>Piese auto <em>noi și second hand</em></h1>
  <div class="hs"><input id="hq" type="search" placeholder="Caută după cod OEM, marcă sau model" onkeydown="if(event.key==='Enter')go()"><button onclick="go()">Caută</button></div>
</div></div>
</div>

<main class="w">
<section id="list" class="pad">
  <div class="sh"><h2>Anunțuri</h2>
  <div class="bar">
    <input id="q" type="search" placeholder="Filtrează: titlu, OEM, marcă, model" oninput="render()" style="width:260px;margin:0">
    <select id="fc" onchange="render()"><option value="">Toate categoriile</option></select>
    <select id="fs" onchange="render()"><option value="">Orice stare</option><option>Nouă</option><option>Second hand</option><option>Recondiționată</option></select>
  </div></div>
  <div id="items" class="list"></div>
</section>

<section id="login" class="pad" hidden>
<div class="sh"><h2>Autentificare admin</h2></div>
<form onsubmit="login(event)"><fieldset><legend>Cont</legend><div class="grid">
<label>Email<input name="email" type="email" required autocomplete="username"></label>
<label>Parolă<input name="pass" type="password" required autocomplete="current-password"></label>
</div></fieldset><button class="btn" type="submit">Intră</button></form>
</section>

<section id="add" class="pad" hidden>
<div class="sh"><h2>Publică o piesă</h2></div>
<form id="f" onsubmit="save(event)">
  <fieldset><legend>Piesa</legend><div class="grid">
    <label class="wide">Titlu anunț *<input name="titlu" required maxlength="90" placeholder="Ex: Far stânga Golf 7 LED"></label>
    <label>Categorie *<select name="cat" required><option value="">Alege...</option><option>Motor</option><option>Cutie de viteze / transmisie</option><option>Frânare</option><option>Suspensie / direcție</option><option>Caroserie / faruri</option><option>Interior</option><option>Electrice / electronice</option><option>Evacuare</option><option>Răcire / climatizare</option><option>Roți / jante / anvelope</option><option>Filtre / consumabile</option><option>Alte piese</option></select></label>
    <label>Marca piesei<input name="marcaPiesa" placeholder="Bosch, Valeo, OEM..."></label>
    <label>Cod piesă (OEM) *<input name="oem" required placeholder="Ex: 5G1941005"></label>
    <label>Cod de referință / alternativ<input name="ref"></label>
    <label>Stare *<select name="stare" required><option value="">Alege...</option><option>Nouă</option><option>Second hand</option><option>Recondiționată</option></select></label>
    <label>Cantitate<input name="cant" type="number" min="1" value="1"></label>
  </div></fieldset>
  <fieldset><legend>Compatibilitate</legend><div class="grid">
    <label>Marca auto *<input name="marca" required placeholder="Volkswagen"></label>
    <label>Model *<input name="model" required placeholder="Golf 7"></label>
    <label>An de la<input name="anDe" type="number" min="1950" max="2035" placeholder="2012"></label>
    <label>An până la<input name="anPana" type="number" min="1950" max="2035" placeholder="2020"></label>
    <label>Motorizare / cod motor<input name="motor" placeholder="1.6 TDI CRKB"></label>
    <label>Combustibil<select name="comb"><option value="">-</option><option>Benzină</option><option>Diesel</option><option>GPL</option><option>Hibrid</option><option>Electric</option></select></label>
    <label class="wide">Serie șasiu (VIN), opțional<input name="vin" maxlength="17" placeholder="17 caractere"></label>
  </div></fieldset>
  <fieldset><legend>Preț și livrare</legend><div class="grid">
    <label>Preț *<input name="pret" type="number" min="0" step="0.01" required></label>
    <label>Monedă<select name="moneda"><option>RON</option><option>EUR</option></select></label>
    <label>Garanție<select name="garantie"><option>Fără garanție</option><option>7 zile</option><option>30 de zile</option><option>6 luni</option><option>12 luni</option></select></label>
    <label>Livrare<select name="livrare"><option>Ridicare personală</option><option>Curier</option><option>Ridicare sau curier</option></select></label>
    <label class="chk"><input type="checkbox" name="negociabil"> Preț negociabil</label>
    <label class="chk"><input type="checkbox" name="factura"> Emit factură</label>
  </div></fieldset>
  <fieldset><legend>Descriere și poze</legend><div class="grid">
    <label class="wide">Descriere<textarea name="desc" placeholder="Stare, defecte, mașina din care provine, ce include..."></textarea></label>
    <label class="wide">Poze (maxim 4)<input id="pics" type="file" accept="image/*" multiple></label>
    <div class="wide" id="thumbs"></div>
  </div></fieldset>
  <fieldset><legend>Contact</legend><div class="grid">
    <label>Nume / firmă *<input name="vanzator" required></label>
    <label>Telefon *<input name="tel" type="tel" required placeholder="07xx xxx xxx"></label>
    <label>Email<input name="email" type="email"></label>
    <label>Localitate / județ *<input name="loc" required placeholder="București"></label>
  </div></fieldset>
  <button class="btn" type="submit">Publică anunțul</button>
</form>
</section>
</main>
<footer><div class="w">© SecondParts</div></footer>
<div id="msg" role="status"></div>

<script src="config.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script src="admin.js"></script>
</body>
</html>
